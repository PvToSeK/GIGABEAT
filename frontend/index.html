<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigaBeat</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">

  <header class="topbar">
    <div class="topbar-logo">
      GigaBeat
    </div>
    <button class="hamburger" id="hamburger-btn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-spacer"></div>

  </header>

  <nav class="sidebar">
    
    <a class="nav-link active" href="index.html">
      Dashboard
    </a>
    <a class="nav-link" href="heartbeat.html">
      Storico Battiti
    </a>
  </nav>

  <main class="main">

    <div class="page-header">
      <h1>Dashboard</h1>
      <p>
        Monitoraggio cardiaco in tempo reale
        <span class="refresh-tag">
          <span class="refresh-dot"></span>
          Aggiornato alle <span id="last-refresh">-</span>
        </span>
      </p>
    </div>

    <div class="stats-grid">
      <div class="stat-card" id="card-bpm">
        <div class="stat-label">BPM Attuale</div>
        <div class="stat-value" id="stat-bpm">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Stato</div>
        <div style="margin-top:10px" id="stat-status">
          <span class="badge badge-blue">In attesa...</span>
        </div>
        <div class="stat-meta" style="margin-top:8px">
          <span id="stat-time" style="font-family:var(--mono);font-size:11px">-</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        Andamento BPM
        <span class="refresh-tag" style="margin-left:auto;font-size:11px">
          <span class="refresh-dot"></span> live - ultimi 30 campioni
        </span>
      </div>
      <div class="chart-wrap">
        <canvas id="bpm-chart"></canvas>
      </div>
    </div>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>

  <!-- Overlay + Drawer (mobile) -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-title">GigaBeat</span>
      <button class="drawer-close" id="drawer-close">&#x2715;</button>
    </div>
    <nav class="drawer-nav">
      
      <a class="drawer-link active" href="index.html">Dashboard</a>
      <a class="drawer-link" href="heartbeat.html">Storico Battiti</a>
    </nav>
  </div>

  <script>
    const overlay = document.getElementById('drawer-overlay');
    const drawer  = document.getElementById('drawer');
    const openBtn = document.getElementById('hamburger-btn');
    const closeBtn= document.getElementById('drawer-close');
    const openDrawer  = () => { drawer.classList.add('open'); overlay.classList.add('open'); };
    const closeDrawer = () => { drawer.classList.remove('open'); overlay.classList.remove('open'); };
    openBtn.addEventListener('click', openDrawer);
    closeBtn.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);
  </script>
</body>
</html>
